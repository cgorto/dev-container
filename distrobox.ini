# Declarative spec for the `dev` container.
#
# Create:   distrobox assemble create -f distrobox.ini
# Recreate: distrobox stop dev && distrobox rm dev && distrobox assemble create -f distrobox.ini
#
# HOME is intentionally not overridden — it mirrors the host home (/home/gorto)
# so dotfiles, ssh keys, git config, and editor state are shared.

[dev]
image=ghcr.io/cgorto/gamedev:latest
init=true
nvidia=true
